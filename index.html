<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = (saved === 'light' || saved === 'dark') ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('sky_hub_theme_css_v1'));
        if (!c || typeof c !== 'object') return;
        var html = document.documentElement;
        var scheme = (c.fixed === 'light' || c.fixed === 'dark') ? c.fixed : html.getAttribute('data-theme');
        var css = c[scheme];
        if (typeof css !== 'string' || /url\s*\(|@import|<\/style|<script/i.test(css)) return;
        html.setAttribute('data-theme', scheme);
        var st = document.createElement('style');
        st.id = 'hub-theme-style';
        st.textContent = css;
        document.head.appendChild(st);
        html.setAttribute('data-hub-theme', 'on');
        html.setAttribute('data-hub-card', c.card === 'flat' || c.card === 'glass' ? c.card : 'soft');
        if (typeof c.font === 'string' && c.font.indexOf('https://fonts.googleapis.com/') === 0) {
          var l = document.createElement('link');
          l.id = 'hub-theme-font'; l.rel = 'stylesheet'; l.href = c.font;
          document.head.appendChild(l);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var c = document.documentElement.classList;
      try {
        var legacy = localStorage.getItem('sky_hub_side_panels');
        var t = localStorage.getItem('sky_side_tools'), d = localStorage.getItem('sky_side_dash');
        if ((t === null ? legacy : t) !== '0') c.add('side-panels-on');
        if ((d === null ? legacy : d) !== '0') c.add('side-dash-on');
      } catch (e) { c.add('side-panels-on'); c.add('side-dash-on'); }
    })();
  </script>
  <title>夜月 - Sky 光遇粉丝工具合集</title>
  <meta name="description" content="为《Sky：光遇》打造的粉丝工具合集应用。持有率管理、计算器、先祖树、乐谱等。">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="夜月">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/chrome.css">
  <link rel="stylesheet" href="css/item.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ui-enhance.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/icon-sprite.js">
  <link rel="modulepreload" href="js/router.js">
  <link rel="modulepreload" href="js/router-registry.js">
  <link rel="modulepreload" href="js/shortcuts.js">
  <link rel="modulepreload" href="js/chrome/site-dock.js">
  <link rel="modulepreload" href="js/chrome/side-panels.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/theme.js">
</head>
<body>
  <aside id="side-left-root" class="side-panel side-left"></aside>
  <aside id="side-right-root" class="side-panel side-right"></aside>
  <div id="dock-root"></div>
  <main id="app-root"><div class="rt-loading"><div class="rt-spinner"></div></div></main>
  <script type="module" src="js/app.js"></script>
